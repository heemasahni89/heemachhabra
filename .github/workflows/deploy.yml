name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcdc-production
  cancel-in-progress: false

# ED25519 host key fingerprint verified on 2026-08-19 via ssh-keyscan against 103.92.235.110:22.
env:
  HOST_KEY_SHA256: "SHA256:4+VB3nUB/C7jLTNCIwJg8oCG1gjWIu40u6fL7n5ON2o"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Validate site
        run: python3 scripts/validate-site.py
      - name: Build deployment archive
        run: python3 scripts/package-site.py --output site-release.tar.gz

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Validate site before network access
        run: python3 scripts/validate-site.py
      - name: Package release
        run: python3 scripts/package-site.py --output site-release.tar.gz
      - name: Configure SSH
        env:
          HR_SSH_KEY: ${{ secrets.HR_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${{ vars.HR_DEPLOY_PATH }}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HR_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
      - name: Deploy via SFTP
        run: |
          set -euo pipefail
          python3 -m pip install --quiet paramiko
          python3 scripts/sftp_deploy.py \
            --host "${{ vars.HR_SSH_HOST }}" \
            --port "${{ vars.HR_SSH_PORT }}" \
            --user "${{ vars.HR_SSH_USER }}" \
            --deploy-path "${{ vars.HR_DEPLOY_PATH }}" \
            --key "$HOME/.ssh/deploy_key" \
            --host-key-sha256 "$HOST_KEY_SHA256" \
            --archive site-release.tar.gz \
            --production-url "https://heemachhabra.com"
