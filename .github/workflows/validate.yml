name: Validate site

on:
  pull_request:
  push:
    branches:
      - main
      - production/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hcdc-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate static site
        run: python3 scripts/validate-site.py
      - name: Build deployment archive
        run: python3 scripts/package-site.py --output site-release.tar.gz
